server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: there is no router library and the OAuth redirect lands on
    # /callback, so any unmatched path must serve index.html and let the React
    # app resolve the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The PWA service worker and manifest must never be cached aggressively,
    # otherwise clients get stuck on a stale shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Long-lived caching for fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
