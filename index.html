<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f14" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <body>
    <!-- Attribution backlink kept in the STATIC source HTML so GetSongBPM can
         verify it by reading the raw page source. It lives INSIDE #root, so once
         JS loads React replaces it on first render and the visible "BPM data:
         GetSongBPM" link (LoginScreen) takes over — no duplicate on screen. -->
    <div id="root">
      <footer class="site-credit">
        Tempo &amp; BPM data by
        <a href="https://getsongbpm.com" target="_blank" rel="noreferrer">GetSongBPM</a>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
